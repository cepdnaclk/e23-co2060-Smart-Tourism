name: Smart Tourism CI Pipeline (Unit, Integration, E2E)

on:
  push:
    branches: [main, dev, devmina, "feature/**", "fix/**"]
  pull_request:
    branches: [main, dev, devmina]
  workflow_dispatch:

env:
  NODE_VERSION: "20.x"

jobs:
  server-unit:
    name: "Server Unit Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server unit tests with coverage
        working-directory: server
        run: npm run test:unit -- --coverage --coverageReporters=lcov --coverageReporters=text --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key

      - name: Upload server unit test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-unit-coverage
          path: server/coverage/
          retention-days: 30

  client-unit:
    name: "Client Unit Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run client unit tests with coverage
        working-directory: client
        run: npm test -- --coverage --watchAll=false --ci --forceExit
        env:
          CI: true

      - name: Upload client unit test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-unit-coverage
          path: client/coverage/
          retention-days: 30

  server-integration:
    name: "Server Integration Tests"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: smart_tourism_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: smart_tourism_test
      JWT_SECRET: ci-test-secret-key
      PORT: 5001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run database migrations
        working-directory: server
        run: npm run db:migrate

      - name: Run server integration tests with coverage
        working-directory: server
        run: npm run test:integration -- --coverage --coverageReporters=lcov --coverageReporters=text --forceExit

      - name: Upload integration test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-integration-coverage
          path: server/coverage/
          retention-days: 30

  e2e:
    name: "E2E Playwright"
    runs-on: ubuntu-latest
    needs: [server-unit, client-unit, server-integration]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: smart_tourism_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: smart_tourism_e2e
      JWT_SECRET: ci-test-secret-key
      PORT: 5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright & browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run database migrations + seed
        working-directory: server
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Build client (production build for E2E)
        working-directory: client
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:5000

      - name: Start backend in background
        working-directory: server
        run: npm start &

      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:5000/api/status --timeout 30000

      - name: Serve client build in background
        working-directory: client
        run: npx serve -s build -l 3000 &

      - name: Wait for frontend to be ready
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run Playwright E2E tests
        working-directory: e2e
        run: npx playwright test --reporter=html,list
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:5000

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload Playwright raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 30

      - name: Upload Playwright screenshots (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-screenshots
          path: e2e/test-results/**/*.png
          retention-days: 14
          
  build:
    name: "Build Production Artifact"
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client (production)
        working-directory: client
        run: npm run build
        env:
          CI: false

      - name: Upload production client build
        uses: actions/upload-artifact@v4
        with:
          name: client-production-build-${{ github.sha }}
          path: client/build/
          retention-days: 90
